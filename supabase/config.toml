[functions.auth-policy]
verify_jwt = false

[auth]
enabled = true
site_url = "https://pinkphone-app.vercel.app"
external_url = "http://127.0.0.1:54321/auth/v1"
additional_redirect_urls = ["https://pinkphone-app.vercel.app/**"]
jwt_expiry = 3600
jwt_issuer = "http://127.0.0.1:54321/auth/v1"
enable_refresh_token_rotation = true

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[storage]
file_size_limit = "50MiB"

[storage.vector]
enabled = false
